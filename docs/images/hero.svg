<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="dsh-wechat-one 工作方式">
  <title>dsh-wechat-one：本地镜像 → 片段索引 → 四种能力</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1f3350"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#14b8a6"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#0f1b2d"/>
  <rect width="1200" height="430" rx="24" fill="url(#dots)"/>

  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <!-- 左：数据来源 -->
    <text x="60" y="64" font-size="15" letter-spacing="3" fill="#5eead4">LOCAL ONLY</text>
    <g transform="translate(60 96)">
      <rect width="250" height="250" rx="18" fill="#132339" stroke="#24405f" stroke-width="2"/>
      <text x="24" y="44" font-size="22" font-weight="700" fill="#e2e8f0">本地明文镜像</text>
      <text x="24" y="72" font-size="14" fill="#94a3b8">由 wechat-decrypt 生成，只读</text>
      <g transform="translate(24 94)">
        <rect width="150" height="28" rx="14" fill="#1d3352"/>
        <rect y="38" width="200" height="28" rx="14" fill="#1d3352"/>
        <rect x="40" y="76" width="162" height="28" rx="14" fill="#14b8a6" opacity="0.25"/>
        <rect y="114" width="120" height="28" rx="14" fill="#1d3352"/>
      </g>
    </g>

    <path d="M330 221 H398" stroke="#14b8a6" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- 中：索引 -->
    <g transform="translate(410 96)">
      <rect width="300" height="250" rx="18" fill="#132339" stroke="#24405f" stroke-width="2"/>
      <text x="24" y="44" font-size="22" font-weight="700" fill="#e2e8f0">对话片段索引</text>
      <text x="24" y="72" font-size="14" fill="#94a3b8">30 分钟断点切片 · 中文二元组全文检索</text>
      <g transform="translate(24 100)" font-size="15" fill="#cbd5e1">
        <rect width="252" height="38" rx="9" fill="#1a2d48"/>
        <text x="14" y="25">涨粉 → 起号 · 完播率 · 引流</text>
        <rect y="50" width="252" height="38" rx="9" fill="#f59e0b" opacity="0.16" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="14" y="75" fill="#fcd34d">每条结论绑定 msg_id 与原话</text>
        <rect y="100" width="252" height="38" rx="9" fill="#1a2d48"/>
        <text x="14" y="125">可选：本机 Ollama 向量融合</text>
      </g>
    </g>

    <path d="M730 221 H798" stroke="#14b8a6" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- 右：四种能力 -->
    <g transform="translate(810 96)" font-size="17" font-weight="600">
      <g>
        <rect width="330" height="52" rx="12" fill="#14b8a6"/>
        <text x="20" y="33" fill="#0f1b2d">主题检索：像 RAG 一样按主题归纳</text>
      </g>
      <g transform="translate(0 66)">
        <rect width="330" height="52" rx="12" fill="#132339" stroke="#14b8a6" stroke-width="2"/>
        <text x="20" y="33" fill="#e2e8f0">精确检索：关键词 · 人 · 时间 · 前后文</text>
      </g>
      <g transform="translate(0 132)">
        <rect width="330" height="52" rx="12" fill="#132339" stroke="#14b8a6" stroke-width="2"/>
        <text x="20" y="33" fill="#e2e8f0">好友人格报告：证据化画像</text>
      </g>
      <g transform="translate(0 198)">
        <rect width="330" height="52" rx="12" fill="#132339" stroke="#14b8a6" stroke-width="2"/>
        <text x="20" y="33" fill="#e2e8f0">群聊日报 · 周报 · 月报</text>
      </g>
    </g>

    <text x="60" y="396" font-size="15" fill="#64748b">在 DeepSeek Harness 里用一句话提问 · 插件不含取钥或解密代码 · 读取前每轮确认</text>
  </g>
</svg>
